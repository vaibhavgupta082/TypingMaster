<div id="results-modal" class="modal-overlay">
    <div class="modal-box">
        <h2 id="result-status" style="margin-top: 0; font-size: 1.75rem;">Test Complete!</h2>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 16px 0;">
        <div style="font-size: 3.5rem; margin: 16px 0; font-weight: 700; color: var(--accent);" id="modal-wpm">0 WPM</div>
        <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px;">Accuracy Performance: <span id="modal-accuracy" style="color: var(--text-main); font-weight: 600;">0</span>%</p>
        <button class="btn-primary" style="width: 100%; padding: 14px;" onclick="closeModal()">Practice Again</button>
    </div>
</div>
